[package]
name = "ridgeline"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "A native-feeling trail route planner and GPX exporter for macOS"
license.workspace = true
publish = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2.11.5", default-features = false, features = ["compression", "wry"] }
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
corelocation-rs = "0.3.7"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[lints]
workspace = true
